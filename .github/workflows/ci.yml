name: Figure checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/work/mpl-cache
      XDG_CACHE_HOME: ${{ github.workspace }}/work/cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install plotting dependencies
        run: python -m pip install -r skills/research-figure/requirements.txt
      - name: Regression checks
        run: python skills/research-figure/tests/test_plot_csv.py
      - name: Render synthetic examples
        run: python skills/research-figure/scripts/demo.py --output work/ci-demo --render
      - name: Verify review case studies
        run: python examples/review-case/render.py --output work/ci-review
